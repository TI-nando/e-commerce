server:
  port: 8081

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://localhost:5433/catalog_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # gera/atualiza o schema automaticamente. Trocar para 'validate' + Flyway/Liquibase em produção.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: catalog

logging:
  level:
    com.ecommerce.product: DEBUG
